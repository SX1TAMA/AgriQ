<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Location Practice</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <div class="container">

        <h1>📍 Location Finder</h1>

        <p>
            Click the button below to get your current location.
        </p>


        <!-- Location Input -->

        <input
            type="text"
            id="location"
            placeholder="Your location will appear here..."
            readonly
        >


        <!-- Get Location Button -->

        <button id="locationBtn">

            📍 Get My Location

        </button>


        <!-- Message -->

        <p id="message"></p>


    </div>


    <!-- JavaScript -->

    <script src="user.js"></script>


</body>

</html>
